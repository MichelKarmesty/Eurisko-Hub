# Eurisko Hub - always-on VM deployment (Option E in docs/deploy.md).
#
# Two containers, both `restart: unless-stopped`, so Docker brings the whole
# stack back by itself after a crash or a reboot - no systemd unit to maintain:
#
#   app    the single production container (deploy/server.mjs: web client + API)
#   caddy  terminates TLS and reverse-proxies to the app
#
# Caddy runs with `network_mode: host` so it can reach the app on 127.0.0.1 and
# bind the privileged ports 80/443 directly. The app itself is also published on
# 8080 as a documented plain-HTTP fallback, so the deployment is never fully
# unreachable if certificate issuance is slow or fails (see deploy/vm/README.md).
#
# Values come from .env next to this file - generated by bootstrap.sh.

name: eurisko-hub

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: eurisko-hub:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # The SQLite file lives here. Without this volume every restart starts
      # from an empty database and the seeded accounts disappear.
      - eurisko-data:/data
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is missing - run deploy/vm/bootstrap.sh}
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  eurisko-data:
  caddy-data:
  caddy-config:
